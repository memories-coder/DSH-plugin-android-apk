# dsh-plugin-android-apk bundle patch.
# Registers one Cordis plugin row: `android-apk-builder`, which exposes the
# `build_android_apk` tool to agents of this profile.
#
# All options shown below are optional (defaults are compiled into the
# plugin); edit this file to change them, then restart the profile.
- insert:
    - id: android-apk-builder
      name: dsh-plugin-android-apk
      config:
        defaultVariant: debug
        jdkMajor: 17
        gradleVersion: "8.9"
